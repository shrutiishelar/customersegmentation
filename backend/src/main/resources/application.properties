# Server Configuration
server.port=${SERVER_PORT:8080}

# Spring Application Name
spring.application.name=customer-segmentation-backend

# MongoDB Connection Configuration
# Defaults to localhost:27017, configurable via MONGODB_URI environment variable
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/customer_segmentation}
spring.data.mongodb.database=${MONGODB_DATABASE:customer_segmentation}

# Multipart File Upload Limits (for CSV uploads)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Logging Configuration
logging.level.com.customersegmentation=INFO
logging.level.org.springframework.data.mongodb=INFO

